# URU2.COM — compilación iOS en Codemagic (sin Mac)
workflows:
  # 1) Prueba: compila para el simulador. No necesita cuenta de Apple ni firma.
  #    Deja un .zip con la app para correrla en el navegador (Appetize.io).
  ios-simulator:
    name: URU2.COM iOS → prueba en simulador
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Compilar para simulador
        script: |
          set -o pipefail
          xcodebuild \
            -workspace another-iptv-player.xcworkspace \
            -scheme another-iptv-player \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/xcodebuild.log | xcpretty || (tail -200 /tmp/xcodebuild.log; exit 1)
      - name: Empaquetar .app
        script: |
          cd build/sim/Build/Products/Debug-iphonesimulator
          zip -qr "$CM_BUILD_DIR/URU2-simulador.zip" *.app
    artifacts:
      - URU2-simulador.zip
      - /tmp/xcodebuild.log

  # 2) Publicación: .ipa firmado y subida a TestFlight.
  ios-testflight:
    name: URU2.COM iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      # Nombre de la API key de App Store Connect que cargás en
      # Codemagic → Team settings → Integrations → Developer Portal.
      app_store_connect: URU2 ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.uru2.player
      vars:
        XCODE_WORKSPACE: another-iptv-player.xcworkspace
        XCODE_SCHEME: another-iptv-player
      xcode: latest
    scripts:
      - name: Firma (certificado + perfil)
        script: xcode-project use-profiles
      - name: Compilar .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
